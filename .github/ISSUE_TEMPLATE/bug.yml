name: Bug report
description: Report a reproducible problem in the reusable template or generator.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Do not include private names, photos, messages, credentials, or deployment URLs.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: "1. Run ...\n2. Edit ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    attributes:
      label: Node.js version
      placeholder: "v22.x"
